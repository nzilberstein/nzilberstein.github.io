{{/* Light/dark toggle. Lives here rather than in header.html so that
     no theme file is forked and `git submodule update` stays clean. */}}
<button id="theme-toggle" type="button" aria-label="Switch colour scheme">
  <span class="icon-dark" aria-hidden="true">&#9788;</span>
  <span class="icon-light" aria-hidden="true">&#9790;</span>
</button>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;

    var root = document.documentElement;

    function label() {
      var now = root.getAttribute("data-theme") === "light" ? "light" : "dark";
      btn.setAttribute(
        "title",
        now === "light" ? "Switch to dark mode" : "Switch to light mode"
      );
    }

    var osQuery = window.matchMedia("(prefers-color-scheme: light)");
    function osTheme() {
      return osQuery.matches ? "light" : "dark";
    }

    btn.addEventListener("click", function () {
      var next =
        root.getAttribute("data-theme") === "light" ? "dark" : "light";
      root.setAttribute("data-theme", next);
      try {
        // Toggling back to whatever the OS already says clears the
        // override, so the site resumes following the visitor's setting.
        if (next === osTheme()) {
          localStorage.removeItem("theme");
        } else {
          localStorage.setItem("theme", next);
        }
      } catch (e) {
        /* private browsing: the choice just won't persist */
      }
      label();
    });

    // If the OS setting changes while the page is open and no explicit
    // choice has been made, follow it live.
    try {
      osQuery.addEventListener("change", function () {
        if (localStorage.getItem("theme")) return;
        root.setAttribute("data-theme", osTheme());
        label();
      });
    } catch (e) {
      /* older browsers: no live switching, the next load still follows */
    }

    label();
  })();
</script>

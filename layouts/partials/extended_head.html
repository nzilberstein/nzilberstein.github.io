{{/* Set the colour scheme before first paint so there is no flash of
     the wrong theme. Runs in <head>, ahead of <body>. */}}
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var theme;
      if (stored === "light" || stored === "dark") {
        // An explicit choice made with the toggle wins.
        theme = stored;
      } else {
        // Otherwise follow the visitor's OS / browser setting.
        theme = window.matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

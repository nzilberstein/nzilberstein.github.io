{{/* Set the colour scheme before first paint so there is no flash of
     the wrong theme. Runs in <head>, ahead of <body>. */}}
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      // Default to dark; only an explicit toggle choice switches to light.
      if (stored !== "light") stored = "dark";
      document.documentElement.setAttribute("data-theme", stored);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

{{/* Two-column intro: photo on the left, everything you write between the
     shortcode tags on the right. Inner content is plain Markdown. */}}
<div class="profile">
  <img
    class="profile__photo"
    src="{{ .Get "src" | safeURL }}"
    {{ with .Get "alt" }}alt="{{ . | plainify }}"{{ end }}
  />
  <div class="profile__body">
    {{ .Inner | markdownify }}
  </div>
</div>
